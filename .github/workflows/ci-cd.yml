name: ci-cd

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ========== Linting and Testing ==========
  lint:
    name: ESLint and Prettier Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check code formatting
        run: npm run prettier:check

  # ========== Unit and Integration Tests ==========
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:integration

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: integration
          name: codecov-umbrella
          fail_ci_if_error: false
  
  # ========== Build Test ==========
  build:
    name: TypeScript Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Verify build output
        run: test -d dist && echo "Build successful" || exit 1

  # ========== Build and Push Docker Image ==========
  build-and-push:
    if: github.event_name == 'workflow_dispatch'
    environment: PROD
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, build]

    outputs:
      image: ${{ steps.set-meta.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine image tag
        id: set-meta
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG=${{ github.event.release.tag_name }}
          else
            TAG=latest
          fi

          IMAGE="${{ secrets.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_APP_NAME }}:$TAG"

          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

          echo "Using tag: $TAG"

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ secrets.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_APP_NAME }}:latest

  # ========== Sync and Deploy to VM ==========
  sync-vm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: PROD
    needs: build-and-push

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_ZENTRA }}" > ~/.ssh/vm_key.pem
          chmod 400 ~/.ssh/vm_key.pem
          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose file
        run: |
          scp -i ~/.ssh/vm_key.pem docker-compose.prod.yml azureuser@"${{ secrets.AZURE_VM_IP }}":~/zentra/docker-compose.prod.yml

      - name: Sync env
        run: |
          ssh -i ~/.ssh/vm_key.pem azureuser@"${{ secrets.AZURE_VM_IP }}" << "EOF"
            set -e

            cd ~/zentra

            echo 'Writing .env'

            rm -f .env

            echo "ACR_LOGIN_SERVER=${{ secrets.ACR_LOGIN_SERVER }}" >> .env
            echo "IMAGE_APP_NAME=${{ vars.IMAGE_APP_NAME }}" >> .env
            echo "IMAGE_TAG=${{ vars.IMAGE_TAG }}" >> .env
            echo "NODE_ENV=${{ vars.NODE_ENV }}" >> .env
            echo "EXPRESS_PORT=${{ vars.EXPRESS_PORT }}" >> .env
            echo "DISCORD_BOT_TOKEN=${{ secrets.DISCORD_BOT_TOKEN }}" >> .env
            echo "DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}" >> .env
            echo "DISCORD_GUILD_ID=${{ secrets.DISCORD_GUILD_ID }}" >> .env
            echo "DISCORD_STANDUP_CHANNEL_ID=${{ secrets.DISCORD_STANDUP_CHANNEL_ID }}" >> .env
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}" >> .env
            echo "LLM_PROVIDER_NAME=${{ vars.LLM_PROVIDER_NAME }}" >> .env
            echo "LLM_MODEL_NAME=${{ vars.LLM_MODEL_NAME }}" >> .env
            echo "API_BASE_URL=${{ vars.API_BASE_URL }}" >> .env
            echo "TRADING_SUMMARY_URL=${{ vars.TRADING_SUMMARY_URL }}" >> .env
            echo "LOG_HOT_ROTATE=${{ vars.LOG_HOT_ROTATE }}" >> .env
            echo "LOG_COLD_ROTATE=${{ vars.LOG_COLD_ROTATE }}" >> .env
            echo "FEATURE_COMMAND_PING=${{ vars.FEATURE_COMMAND_PING || 'true' }}" >> .env
            echo "FEATURE_COMMAND_ADD_TICKER=${{ vars.FEATURE_COMMAND_ADD_TICKER || 'true' }}" >> .env
            echo "FEATURE_COMMAND_REMOVE_TICKER=${{ vars.FEATURE_COMMAND_REMOVE_TICKER || 'true' }}" >> .env
            echo "FEATURE_COMMAND_LIST_TICKERS=${{ vars.FEATURE_COMMAND_LIST_TICKERS || 'true' }}" >> .env
            echo "FEATURE_COMMAND_MARKET_SUMMARY=${{ vars.FEATURE_COMMAND_MARKET_SUMMARY || 'true' }}" >> .env
            echo "FEATURE_COMMAND_SUMMARIZE=${{ vars.FEATURE_COMMAND_SUMMARIZE || 'true' }}" >> .env
            echo "FEATURE_COMMAND_QUERIES=${{ vars.FEATURE_COMMAND_QUERIES || 'true' }}" >> .env
            echo "FEATURE_COMMAND_USE_QUERY=${{ vars.FEATURE_COMMAND_USE_QUERY || 'true' }}" >> .env
            echo "POSTGRESQL_URL=${{ secrets.POSTGRESQL_URL }}" >> .env

            echo 'Sync complete'
          EOF

  deploy:
    if: github.event_name == 'workflow_dispatch'
    environment: PROD
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: sync-vm

    steps:
      - name: Setup SSH trust
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AZURE_ZENTRA }}" > ~/.ssh/vm_key.pem
          chmod 400 ~/.ssh/vm_key.pem
          ssh-keyscan -H "${{ secrets.AZURE_VM_IP }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -T -i ~/.ssh/vm_key.pem azureuser@"${{ secrets.AZURE_VM_IP }}" << EOF
            set -e

            cd ./zentra

            echo 'Logging in'
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ secrets.ACR_LOGIN_SERVER }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

            echo "Pulling latest image"
            docker pull ${{ secrets.ACR_LOGIN_SERVER }}/${{ vars.IMAGE_APP_NAME }}:${{ vars.IMAGE_TAG }}

            echo "Restarting services"
            docker-compose -f docker-compose.prod.yml up -d

            echo "Cleaning up unused images"
            docker image prune -f

            echo "Deployment completed successfully."
          EOF
