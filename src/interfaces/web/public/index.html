<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zentra Dev Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 24px;
    }

    h1 {
      margin-bottom: 16px;
    }

    .card {
      background: #1e293b;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      margin-right: 8px;
    }

    button:hover {
      background: #2563eb;
    }

    textarea {
      width: 100%;
      height: 120px;
      margin-top: 8px;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
    }

    .log {
      background: #020617;
      padding: 12px;
      border-radius: 6px;
      height: 200px;
      overflow-y: auto;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <h1>Zentra Dev Panel</h1>

  <div class="card">
    <h3>Quick Actions</h3>
    <button onclick="triggerIHSG()">Run IHSG Worker</button>
    <button onclick="triggerPR()">Run PR Summary</button>
    <button onclick="triggerMarketAnalysisWorker()">Run Market Analysis</button>
  </div>

  <div class="card">
    <h3>Custom Event</h3>
    <label>Event Name</label>
    <input id="eventName" placeholder="IHSG_REQUESTED" />

    <label>Payload (JSON)</label>
    <textarea id="payload">{ "symbol": "^JKSE" }</textarea>

    <button onclick="emitCustom()">Emit Event</button>
  </div>

  <div class="card">
    <h3>Logs</h3>
    <div id="log" class="log"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
